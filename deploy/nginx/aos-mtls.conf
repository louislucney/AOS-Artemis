# mobile-testing runner 控制面 / MCP 的 mTLS + OCSP stapling 反向代理示例。
# 上游 mobile-testing 保持 HTTP loopback，TLS 由本代理终止。
server {
    listen 443 ssl;
    http2 on;
    server_name aos.example.com;

    ssl_certificate     /etc/aos/tls/fullchain.pem;
    ssl_certificate_key /etc/aos/tls/server.key;

    # mTLS：客户端证书必须由 mobile-testing runner CA 签发。
    ssl_client_certificate /etc/aos/tls/runner-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_crl /etc/aos/tls/runner-ca.crl;

    # OCSP stapling：证书需带 OCSP AIA；建议 Must-Staple。
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/aos/tls/fullchain.pem;
    resolver 127.0.0.53 valid=300s;
    resolver_timeout 5s;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:aos_tls:10m;
    ssl_session_timeout 1h;

    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # runner 鉴权头必须原样透传。
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-AOS-Host-Id $http_x_aos_host_id;
    }
}
